AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'accenprep-portal

  SAM Template for AccenPrep Mock Assessment Portal

  '
Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        QUESTIONS_TABLE:
          Ref: QuestionsBank
        RESULTS_TABLE:
          Ref: UserResults
        USER_STATS_TABLE:
          Ref: UserStats
        BATTLE_CONNECTIONS_TABLE:
          Ref: BattleConnectionsTable
Resources:
  AccenPrepUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
  AccenPrepUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: AccenPrepClient
      UserPoolId:
        Ref: AccenPrepUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_PASSWORD_AUTH
  QuestionsBank:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: testId
        AttributeType: S
      - AttributeName: questionId
        AttributeType: S
      KeySchema:
      - AttributeName: testId
        KeyType: HASH
      - AttributeName: questionId
        KeyType: RANGE
  UserResults:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: timestamp
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: timestamp
        KeyType: RANGE
  UserStats:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
  AccenPrepApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowHeaders:
        - '*'
        AllowMethods:
        - '*'
  GetQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetQuestionsFunction
      Handler: app.getQuestionsHandler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: QuestionsBank
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /tests/{testId}
            Method: get
            ApiId:
              Ref: AccenPrepApi
    Metadata:
      SamResourceId: GetQuestionsFunction
  SubmitResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SubmitResultFunction
      Handler: app.submitResultHandler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: QuestionsBank
      - DynamoDBWritePolicy:
          TableName:
            Ref: UserResults
      - DynamoDBWritePolicy:
          TableName:
            Ref: UserStats
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /tests/submit
            Method: post
            ApiId:
              Ref: AccenPrepApi
    Metadata:
      SamResourceId: SubmitResultFunction
  GetProfileStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetProfileStatsFunction
      Handler: app.getProfileStatsHandler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: UserStats
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /profile/{userId}
            Method: get
            ApiId:
              Ref: AccenPrepApi
    Metadata:
      SamResourceId: GetProfileStatsFunction
  EvaluateSpeechFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: EvaluateSpeechFunction
      Handler: app.evaluateSpeechHandler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /speech/evaluate
            Method: post
            ApiId:
              Ref: AccenPrepApi
    Metadata:
      SamResourceId: EvaluateSpeechFunction
  BattleArenaWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: BattleArenaWebSocketApi
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
  BattleConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: connectionId
        AttributeType: S
      KeySchema:
      - AttributeName: connectionId
        KeyType: HASH
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WebSocketConnectFunction
      Handler: websocket.connectHandler
      Runtime: nodejs20.x
      Policies:
      - DynamoDBWritePolicy:
          TableName:
            Ref: BattleConnectionsTable
    Metadata:
      SamResourceId: WebSocketConnectFunction
  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WebSocketDisconnectFunction
      Handler: websocket.disconnectHandler
      Runtime: nodejs20.x
      Policies:
      - DynamoDBWritePolicy:
          TableName:
            Ref: BattleConnectionsTable
    Metadata:
      SamResourceId: WebSocketDisconnectFunction
  WebSocketSendMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WebSocketSendMessageFunction
      Handler: websocket.sendMessageHandler
      Runtime: nodejs20.x
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattleConnectionsTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BattleArenaWebSocketApi}/*
    Metadata:
      SamResourceId: WebSocketSendMessageFunction
Outputs:
  ApiEndpoint:
    Description: API Gateway HTTP endpoint URL
    Value:
      Fn::Sub: https://${AccenPrepApi}.execute-api.${AWS::Region}.amazonaws.com
  WebSocketEndpoint:
    Description: WebSocket API endpoint URL
    Value:
      Fn::Sub: wss://${BattleArenaWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  UserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: AccenPrepUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value:
      Ref: AccenPrepUserPoolClient
  QuestionsTableName:
    Description: Generated DynamoDB Questions Table Name
    Value:
      Ref: QuestionsBank
  UserStatsTableName:
    Description: Generated DynamoDB User Stats Table Name
    Value:
      Ref: UserStats
